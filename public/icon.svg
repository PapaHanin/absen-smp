<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f2347" />
      <stop offset="100%" stop-color="#09152e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Golden Border Ring -->
  <circle cx="256" cy="256" r="216" stroke="url(#goldGrad)" stroke-width="8" opacity="0.9" />
  <circle cx="256" cy="256" r="206" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Central Crest Area with Shadow -->
  <g filter="url(#dropShadow)" transform="translate(56, 56) scale(4)">
    <!-- Tut Wuri Handayani 100x100 viewBox -->
    <!-- 1. Belimbing Segi Lima (Pentagon Outer Frame) -->
    <path
      d="M50 4 L94 36 L77 88 L23 88 L6 36 Z"
      fill="#ffffff"
      stroke="#d97706"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <path
      d="M50 8 L90 37 L74 84 L26 84 L10 37 Z"
      fill="none"
      stroke="#0284c7"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- 2. Sayap Burung Garuda (Garuda Wings) -->
    <!-- Left Wing -->
    <path
      d="M50 50 C40 42 22 45 16 56 C24 55 35 56 46 64 C35 63 22 66 18 73 C28 71 38 72 48 76 C40 76 28 80 26 83 C36 82 44 80 50 78 Z"
      fill="#eab308"
      opacity="0.95"
    />
    <!-- Right Wing -->
    <path
      d="M50 50 C60 42 78 45 84 56 C76 55 65 56 54 64 C65 63 78 66 82 73 C72 71 62 72 52 76 C60 76 72 80 74 83 C64 82 56 80 50 78 Z"
      fill="#eab308"
      opacity="0.95"
    />

    <!-- 3. Ekor Garuda (Tail Feathers) -->
    <path
      d="M44 76 L44 86 L50 84 L56 86 L56 76 Z"
      fill="#0284c7"
    />

    <!-- 4. Buku Terbuka (Open Book of Knowledge) -->
    <path
      d="M50 63 C44 59 36 60 30 63 L30 71 C36 68 44 67 50 70 C56 67 64 68 70 71 L70 63 C64 60 56 59 50 63 Z"
      fill="#ffffff"
      stroke="#0284c7"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <line x1="50" y1="63" x2="50" y2="70" stroke="#0284c7" stroke-width="1.5" />

    <!-- 5. Belencong / Api Menyala (Torch & Flame of Learning) -->
    <path
      d="M50 22 C48 30 42 34 42 40 C42 46 46 50 50 50 C54 50 58 46 58 40 C58 34 52 30 50 22 Z"
      fill="#dc2626"
    />
    <path
      d="M50 28 C49 33 46 36 46 41 C46 44 48 47 50 47 C52 47 54 44 54 41 C54 36 51 33 50 28 Z"
      fill="#f59e0b"
    />
    <!-- Base of Lamp -->
    <path
      d="M43 50 L57 50 L54 56 L46 56 Z"
      fill="#0284c7"
    />
  </g>

  <!-- Bottom Badge Banner with School Name -->
  <g transform="translate(66, 418)">
    <rect x="0" y="0" width="380" height="44" rx="22" fill="#0f2347" stroke="url(#goldGrad)" stroke-width="3" />
    <text x="190" y="28" text-anchor="middle" fill="#fef08a" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" letter-spacing="1.5">SMPN SATAP 4 PALASA</text>
  </g>
</svg>